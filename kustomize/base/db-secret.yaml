# Same pattern as examples/app/aws/db-secret.yaml - replace <PROJECT_NAME>
# with your infra repo's project_name. Only needed if your infra repo has
# enable_external_secrets on; otherwise create this Secret by hand instead.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: demo-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef:
        key: <PROJECT_NAME>/app/db-password
