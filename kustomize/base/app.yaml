# See ../README.md. Same demo app as examples/app/aws/, without the
# Ingress - kept minimal since this base is reused across multiple
# environments below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo
          args:
            - "-text=hello from the sample app"
          ports:
            - containerPort: 5678
          # env:
          #   - name: DB_PASSWORD
          #     valueFrom:
          #       secretKeyRef:
          #         name: demo-db-credentials
          #         key: db-password
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    app: app
  ports:
    - port: 80
      targetPort: 5678
